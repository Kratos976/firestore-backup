name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Re-test selected tag
        run: |
          python -m compileall -q firestore_backup tests
          python -m pytest -q
      - name: Verify requested tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import firestore_backup; print(firestore_backup.__version__)')"
          test "${{ inputs.tag }}" = "v${PACKAGE_VERSION}"
      - name: Verify GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
