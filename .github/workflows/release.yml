name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import firestore_backup; print(firestore_backup.__version__)')"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
      - name: Create draft, attach artifacts, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')"

            if [ "$IS_DRAFT" != "true" ]; then
              ACTUAL_ASSETS="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
              MISSING=0

              for FILE in dist/*; do
                NAME="$(basename "$FILE")"
                if ! grep -Fxq "$NAME" <<<"$ACTUAL_ASSETS"; then
                  echo "::error::Published release $TAG already exists but is missing asset: $NAME"
                  MISSING=1
                fi
              done

              if [ "$MISSING" -ne 0 ]; then
                echo "::error::Published immutable releases cannot receive missing assets. Create releases only through this workflow."
                exit 1
              fi

              echo "Release $TAG is already published with all expected artifacts."
              exit 0
            fi
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --verify-tag \
              --generate-notes \
              --title "$TAG" \
              --draft
          fi

          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false
