[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "firestore-backup"
version = "1.0.0"
description = "Export Firestore to JSON/NDJSON and generate PostgreSQL, MySQL or SQLite SQL"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kratos976" }]
keywords = [
    "firestore",
    "firebase",
    "backup",
    "export",
    "json",
    "ndjson",
    "sql",
    "postgresql",
    "mysql",
    "sqlite",
    "migration",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
dependencies = ["google-cloud-firestore>=2.22.0,<3"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8,<10",
]

[project.urls]
Homepage = "https://github.com/Kratos976/firestore-backup"
Repository = "https://github.com/Kratos976/firestore-backup"
Issues = "https://github.com/Kratos976/firestore-backup/issues"
Changelog = "https://github.com/Kratos976/firestore-backup/blob/main/CHANGELOG.md"

[project.scripts]
firestore-backup = "firestore_backup.cli:main"

[tool.setuptools]
packages = ["firestore_backup"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
